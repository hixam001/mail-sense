[project]
name = "mailsense-backend"
version = "1.0.0"
requires-python = "==3.12.15"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "numpy==2.5.5",
    "pandas==3.1.1",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
]

[dependency-groups]
dev = [
    "httpx2==2.16.2",
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[tool.uv]
package = false
required-version = "==0.13.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
